apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: n8n-secrets
  namespace: n8n
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "7972e60d-fbc0-415b-93ca-d0244c2f9390"
    keyvaultName: "enjunior-kv-n8n-mercury"
    tenantId: "c9f63876-e8f3-4869-9d96-cabc1a6e3286"
    objects: |
      array:
        - |
          objectName: db-user
          objectType: secret
        - |
          objectName: db-password
          objectType: secret
  secretObjects:
    - secretName: n8n-container-env
      type: Opaque
      data:
        - objectName: db-user
          key: "DB_POSTGRESDB_USER"
        - objectName: db-password
          key: "DB_POSTGRESDB_PASSWORD"
