apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-configmap
  namespace: n8n
data:
  GENERIC_TIMEZONE: America/Montreal
  TZ: America/Montreal
  SSL_EMAIL: n8n@enjunior.ca
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_PORT: "5678"
  # N8N_PROTOCOL: https
  N8N_PROTOCOL: http
  N8N_SECURE_COOKIE: "false"
  NODE_ENV: production
  N8N_RESTRICT_FILE_ACCESS_TO: /files
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: "enjunior-psql-n8n-mercury.postgres.database.azure.com"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"
  # For learning purposes only!
  DB_POSTGRESDB_USER: "n8nadmin"
  DB_POSTGRESDB_PASSWORD: "n8n-password-123"
